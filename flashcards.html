<script>window.DECK=[{"u": "00-exam", "t": "How the midterm works", "f": "When and where is the midterm?", "b": "Thursday, October 8, in Dwinelle 155, starting around 9:40 am. It is a 60-minute exam inside the 80-minute class slot, with assigned seats from a randomized seating chart."}, {"u": "00-exam", "t": "How the midterm works", "f": "What is the best guide to this midterm, according to Edwards?", "b": "The Fall 2025 midterm, the only past exam, which he wrote himself. He said the format will be very similar."}, {"u": "00-exam", "t": "How the midterm works", "f": "How was the Fall 2025 midterm structured?", "b": "60 points in 60 minutes: 2 free points, Question 1 with eight 2-point short questions (16 points), a 24-point egg market story, and an 18-point Taylor Swift monopoly story."}, {"u": "00-exam", "t": "How the midterm works", "f": "Is there multiple choice on the midterm?", "b": "No. Fall 2025 had none; every answer was written in a box or drawn on printed axes. He has said he detests multiple choice."}, {"u": "00-exam", "t": "How the midterm works", "f": "How many points is a graph question worth?", "b": "4 points each on Fall 2025, as much as two short questions. The three graphs were 12 of the 60 points."}, {"u": "00-exam", "t": "How the midterm works", "f": "What did Edwards say about monopoly on this midterm?", "b": "It will be on the exam as a shorter question than the 18-point Taylor Swift question, but you still need the full logic: quantity where marginal revenue equals marginal cost, price read off demand."}, {"u": "00-exam", "t": "How the midterm works", "f": "Which topics did he say are sure to appear?", "b": "Supply and demand curves, price elasticity of demand (including a quantity shock implying a percent price change), and whether demand is flat or steep. Topics covered more in class will weigh more."}, {"u": "00-exam", "t": "How the midterm works", "f": "What did he say is not tested?", "b": "Average total cost curves and profit rectangles, the zero-profit monopolist, monopsony, indifference curves and income and substitution effects, logs for big percent changes, calculus, coding, and why marginal revenue is twice as steep."}, {"u": "00-exam", "t": "How the midterm works", "f": "What does 'Less is more' mean on his exams?", "b": "Rule 6 on the cover page: write legibly, stay inside the box, and do not fill the space with words. His own key answers are two to six sentences."}, {"u": "00-exam", "t": "How the midterm works", "f": "Do you need to match the answer key word for word?", "b": "No. He said you need to get in the general sandbox of the answer, and clear shorthand is fine. Your answer has to touch the key's points."}, {"u": "00-exam", "t": "How the midterm works", "f": "Which phrase is required for full credit on the cost of college?", "b": "Foregone earnings (the wages you give up by not working full time). The Fall 2025 key says full credit answers need to state it, alongside tuition and fees."}, {"u": "00-exam", "t": "How the midterm works", "f": "What should a calculation answer include?", "b": "The number plus the work and a sentence on what it means. He said exams usually say 'Explain' and you need some kind of explanation, not just the number."}, {"u": "00-exam", "t": "How the midterm works", "f": "Does he give partial credit?", "b": "Yes, down to quarter points (the lowest Fall 2025 score was 11.75). Never leave a box blank."}, {"u": "00-exam", "t": "How the midterm works", "f": "What should you do if a question's wording is unclear?", "b": "Write how you are reading it and answer that version. He said that earns at least partial if not full credit."}, {"u": "00-exam", "t": "How the midterm works", "f": "What is the 2-point answer recipe?", "b": "Answer first, then one or two sentences of why in his vocabulary (marginal benefit, marginal cost, opportunity cost), then any numbers, then stop."}, {"u": "00-exam", "t": "How the midterm works", "f": "What does a full-credit 4-point graph include?", "b": "Slopes that match the story, the equilibrium at the given numbers with dotted lines to both axes, every curve labeled, shifted curves marked with a prime, and new values shown."}, {"u": "00-exam", "t": "How the midterm works", "f": "What did he tell students to write on the cheat sheet about slopes?", "b": "Inelastic means steep and elastic means flat."}, {"u": "00-exam", "t": "How the midterm works", "f": "What are the cheat sheet rules?", "b": "One page, front and back, typed or handwritten, on paper (no screens). You may make it with friends and each bring a copy, but he advises making your own."}, {"u": "00-exam", "t": "How the midterm works", "f": "What else did he suggest putting on the cheat sheet?", "b": "The Rational Spending Rule, marginal revenue equals marginal cost with the monopoly diagram, and a supply and demand cross with supply labeled."}, {"u": "00-exam", "t": "How the midterm works", "f": "What should you bring on Thursday?", "b": "Your Cal ID (shown when you hand in the exam), a stand-alone calculator, your cheat sheet, and pencils; a ruler helps. No phones, laptops, or smart glasses."}, {"u": "00-exam", "t": "How the midterm works", "f": "What happens if you keep writing after time is called?", "b": "The Fall 2025 cover page set a 10-point penalty, then another 10, until the exam is handed in. 60 minutes is a hard stop."}, {"u": "00-exam", "t": "How the midterm works", "f": "Is there a clobber policy this term?", "b": "No. The final cannot replace the midterm score, and he said he will never curve anyone down."}, {"u": "00-exam", "t": "How the midterm works", "f": "What is a good pace for the exam?", "b": "About one point per minute: roughly 2 minutes per 2-point box and 4 minutes per 4-point graph. Write your name and ID on every page first for a free point."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "What is opportunity cost?", "b": "The value of what must be given up to do an activity: the value of the best alternative you did not choose. If you are doing one thing, you cannot be doing something else."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "What is Edwards' definition of scarcity?", "b": "Someone or something faces a constraint. Because of constraints, people, firms, and countries must choose, and every choice has an opportunity cost."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "State the cost-benefit principle.", "b": "Take an action if and only if its benefits outweigh its costs, where the cost that matters is the opportunity cost."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "How do economists value your free time?", "b": "At roughly your wage. If leisure were worth much less than your wage you would work more, so a consultant earning $100 an hour values leisure at about $100 an hour."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "What is the opportunity cost of using a ticket whose market price has changed since you bought it?", "b": "What you could sell it for at the time of use plus the value of your time. The price you paid is sunk and irrelevant."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "What is the opportunity cost of a year of college?", "b": "Tuition, fees, books, and supplies plus the foregone earnings from a full-time job. Full credit on the Fall 2025 midterm required the words \"foregone earnings.\""}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "Why are rent and food left out of the opportunity cost of college?", "b": "You pay them whether or not you go to college, so they cancel when you compare the two paths."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "Tuition and fees $15,000, books $1,000, rent and food $20,000, possible earnings $60,000. Opportunity cost of a year of college?", "b": "$15,000 + $1,000 + $60,000 = $76,000. Rent and food cancel."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "A free afternoon makes 2 bookcases or 3 TV shows. Opportunity cost of one show? Of one bookcase?", "b": "One show costs 2/3 of a bookcase. One bookcase costs 1.5 shows."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "A free Warriors ticket resells for $150; going takes 4 hours and you earn $20 an hour. Opportunity cost of going?", "b": "$150 + 4 \u00d7 $20 = $230."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "Is a $200, 3-hour concert ticket expensive when the average wage is about $36 an hour?", "b": "Yes, high: 3 hours of time is worth about $108, so the ticket costs nearly twice that."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "What is the slope of the PPC?", "b": "Minus the opportunity cost of the good on the horizontal axis. The opportunity cost of the vertical-axis good is the reciprocal."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "Moving along a PPC adds 10 units of consumption (horizontal) and loses 30 units of investment. Opportunity cost of one unit of consumption?", "b": "3 units of investment, since the slope is \u221230 \u00f7 10 = \u22123."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "What does a point on, inside, or outside the PPC mean?", "b": "On: productively efficient, all inputs used. Inside: idle resources, such as a recession. Outside: unattainable with current labor, capital, and technology."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "Where is a recession on the PPC graph?", "b": "At a point inside the PPC, like the COVID recession when waiters and bartenders were idle. The curve does not shift, because the inputs still exist."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "Why is the PPC bowed out?", "b": "The opportunity cost of the horizontal-axis good rises as more is made. Resources best suited to that good are moved first; later units require resources much better at the other good."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "Does a flatter PPC mean a higher or lower opportunity cost of the horizontal-axis good?", "b": "Lower. A flat stretch means you give up little of the vertical good per unit; say \"flatter\" or \"smaller in absolute value,\" not \"smaller slope.\""}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "What shifts the PPC outward?", "b": "More labor (immigration, births, training), more capital, or better technology."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "How does choosing more investment today affect the future PPC?", "b": "It shifts the future PPC out by more, because investment goods add to the capital stock. Choosing more consumption today gives a smaller future shift."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "What is the difference between consumption goods and investment goods?", "b": "Consumption goods satisfy a current want and are used up. Investment goods are the flow of new capital goods into the capital stock and make the economy more productive later."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "When do living expenses like rent count in the opportunity cost of college?", "b": "Only when you would not pay them otherwise. They cancel when you pay them on both paths; a student who would live rent-free at home but pays rent at Berkeley counts that rent as a cost of college."}, {"u": "01-opportunity-cost", "t": "Opportunity cost and the PPC", "f": "Is painting your own house because you cannot check a hired painter's quality an opportunity cost argument?", "b": "No. Edwards said that is an information problem, distinct from opportunity cost. The opportunity cost of painting is materials plus the value of your time."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "What is the difference between absolute advantage and comparative advantage?", "b": "Absolute advantage means producing more of a good per hour than someone else. Comparative advantage means producing a good at a lower opportunity cost. Specialization follows comparative advantage."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "How do you compute the opportunity cost of 1 unit of X from hourly rates?", "b": "Divide the units of Y made per hour by the units of X made per hour. The opportunity cost of Y is the reciprocal."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "What does the slope of a PPC tell you?", "b": "The slope is minus the opportunity cost of the good on the horizontal axis. A flatter PPC means a lower opportunity cost of that good."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "Bill makes 1 fish or 1 coconut per hour; Chris makes 8 fish or 2 coconuts. What does a coconut cost each of them?", "b": "A coconut costs Bill 1 fish and costs Chris 8 \u00f7 2 = 4 fish. A fish costs Bill 1 coconut and costs Chris \u00bc coconut."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "Who should specialize in what, Bill or Chris?", "b": "Chris fishes and Bill gathers coconuts, because a coconut costs Chris 4 fish but costs Bill only 1 fish. Chris's absolute advantage in both goods does not matter."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "What are the intercepts and slope of the Bill and Chris island PPC without specialization?", "b": "90 fish and 30 coconuts, a straight line with slope \u22123, because each hour both switch trades 9 fish for 3 coconuts."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "Describe the Bill and Chris island PPC with specialization.", "b": "It runs from (0 coconuts, 90 fish) to a kink at (10, 80) to (30, 0). The slope is \u22121 while Bill switches to coconuts and \u22124 once only Chris can switch."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "How many extra fish does specialization give Bill and Chris at 10 coconuts?", "b": "20 fish: 80 with specialization against 90 \u2212 3 \u00d7 10 = 60 without."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "Do the PPCs with and without specialization share intercepts?", "b": "Yes. Both reach 90 fish and 30 coconuts (110 and 50 with Robinson). The specialized PPC is higher only between the intercepts."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "A fishhook doubles both Bill's and Chris's fish per hour. What changes?", "b": "Nothing. A coconut now costs Bill 2 fish and Chris 8 fish, so Bill still gathers coconuts and Chris still fishes. A proportional change keeps the ranking."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "When can a productivity change flip comparative advantage?", "b": "Only when it is uneven. For example, if Bill alone rose to 5 fish per hour, a coconut would cost him 5 fish, more than Chris's 4, and they would swap roles."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "Robinson makes 2 fish or 2 coconuts per hour. Who gathers coconuts in Problem Set 1?", "b": "Bill and Robinson both gather coconuts and Chris fishes, because Bill and Robinson have the same opportunity cost of a coconut (1 fish), lower than Chris's 4."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "What is PPC1 (no specialization) with Robinson on the island?", "b": "A straight line from 110 fish to 50 coconuts with slope \u2212110 \u00f7 50 = \u22122.2."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "What is PPC2 (with specialization) with Robinson on the island?", "b": "Same intercepts, 110 fish and 50 coconuts, with one kink at (30 coconuts, 80 fish); slope \u22121 above the kink and \u22124 below it."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "Why does Robinson's PPC2 have only one kink?", "b": "Bill and Robinson have the same opportunity cost, so their segments share slope \u22121 and line up into one straight piece."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "Tom makes 24 nuts or 12 coffee per day; Krisha makes 12 nuts or 24 coffee. Who has which comparative advantage?", "b": "A pound of nuts costs Tom \u00bd pound of coffee and Krisha 2 pounds, so Tom has the comparative advantage in nuts and Krisha in coffee. Neither has an absolute advantage in both."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "What do Tom and Krisha get alone and with specialization?", "b": "Alone each gets (8 nuts, 8 coffee). Specializing gives 24 of each, split 50-50 to (12, 12) each, which is outside both individual PPCs."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "Describe Tom and Krisha's joint PPC with specialization.", "b": "From 36 coffee, Tom switches to nuts first (slope \u2212\u00bd) to the kink at (24, 24), then Krisha switches (slope \u22122) down to 36 nuts."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "At what prices can Bill and Chris trade so both gain?", "b": "A coconut must trade for more than 1 fish and less than 4 fish, between their two opportunity costs. For Tom and Krisha, a pound of nuts must trade for between \u00bd and 2 pounds of coffee."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "When are there gains from specialization?", "b": "When opportunity costs differ across producers and production follows comparative advantage. Identical opportunity costs mean no gains."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "Why is a country's PPC bowed out?", "b": "Producers with the lowest opportunity cost switch first and higher-cost ones later, so the slope gets steeper. Two people give one kink; many people give a smooth curve."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "What does specialization require, according to Edwards?", "b": "Trust and institutions: laws, police, courts, a constitution, the rule of law. Both gain as long as there is no coercion."}, {"u": "02-comparative-advantage", "t": "Comparative advantage", "f": "How should you answer 'should she do it herself or hire someone?'", "b": "From opportunity cost: compare the value of her time on the task with the price of hiring. Edwards warned that budget reasoning ('she cannot afford it') can lead you astray."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Which curve slopes downward, and why?", "b": "Demand. Marginal benefit (marginal utility, willingness to pay) falls as quantity rises, so buyers only buy more at a lower price: more is better, but at a decreasing rate."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Why does supply slope upward?", "b": "Supply is marginal cost, and marginal cost rises as output grows because extra output comes from producers with higher opportunity costs (Bill at 1 fish per coconut, then Chris at 4)."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "What does it mean that buyers and sellers are price takers?", "b": "There are many small buyers and sellers who do not collude, so none can change the market price; each just chooses a quantity at the going price. Edwards calls this the competitive model."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "What happens when the price is below equilibrium?", "b": "Quantity demanded exceeds quantity supplied, a shortage equal to Qd minus Qs, and buyers bid the price up toward equilibrium. Neither curve shifts."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "What happens when the price is above equilibrium?", "b": "Quantity supplied exceeds quantity demanded, a surplus equal to Qs minus Qd, and sellers cut the price toward equilibrium. Neither curve shifts."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Does a change in a good's own price shift its demand or supply curve?", "b": "No. A change in the good's own price is a movement along both curves. Only something other than the good's own price shifts a curve."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Is a supply increase a shift up or down?", "b": "Down (and right). Marginal cost is lower at every quantity, so the curve sits lower. A supply decrease is a shift left, which is up."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Name the main demand shifters.", "b": "Prices of substitutes and complements, income, tastes and fashion, number of buyers, and expectations about the future (a famous artist dies)."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Name the main supply shifters.", "b": "Technology and productivity (fracking), input prices (feed, fertilizer), number of sellers (Anchor House), regulation (a fracking ban), and nature or disease (bird flu, drought, bumper crops)."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Demand increases, supply unchanged. What happens to P and Q?", "b": "Both rise. The equilibrium moves up along the supply curve."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Supply increases, demand unchanged. What happens to P and Q?", "b": "Price falls and quantity rises. The equilibrium moves down along the demand curve to the southeast."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Demand and supply both shift right. What do you know for sure?", "b": "Quantity rises. Price could go either way, depending on which shift is larger."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Demand shifts right and supply shifts left. What do you know for sure?", "b": "Price rises. Quantity could go either way, depending on which shift is larger."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Price and quantity both rose. Which curve most likely shifted?", "b": "Demand increased (or the demand shift was the bigger one). If P and Q move in opposite directions, supply shifted."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "When demand shifts, how does the steepness of supply matter?", "b": "The equilibrium slides along supply. Flat supply means mostly Q changes; steep supply means mostly P changes; vertical supply means only P changes."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Why did egg prices triple in early 2025 while quantity barely fell?", "b": "Bird flu shifted supply left (up), and egg demand is steep because eggs have no one-for-one substitute, so the shock went mostly into price: about $2 to about $6, with quantity from 10 to about 8 billion dozen."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Why was the egg price spike a supply shock, not a demand shock?", "b": "Spikes came in January 2023 and January 2025 after the fall bird migration spread avian flu; no baking story explains a jump in 2023, none in 2024, and another in 2025."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "How do you draw the Fall 2025 egg baseline graph?", "b": "Steep demand and flat, low upward-sloping supply crossing at 10 billion dozen and $2, with dotted lines to both axes, price on the vertical axis."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "How is market demand built from individual demands?", "b": "Add every buyer's quantity at each price (a horizontal sum), never prices. The market curve kinks where another buyer enters."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "What are the steps for a supply and demand story question?", "b": "Name the market, name the buyers and sellers, ask whose story it is, decide shift or movement and the direction, use the other curve's shape, then state P and Q with values."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Fewer people need gas. Does supply shift?", "b": "No. That is a story about buyers, so demand for gasoline shifts in and P and Q fall. Buyers and sellers are different groups."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Houston worse summer heat (Problem Set 1): which curve and what happens?", "b": "Demand for apartments shifts in as people move away, so rent and the number of apartments rented both fall."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "Houston new light rail (Problem Set 1): which curve, and why might California differ?", "b": "Demand shifts out, raising rent and eventually quantity. Houston's flat supply means mostly more apartments; California's steep supply would mean mostly higher rents."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "A rent ceiling below the market rent: which curve shifts?", "b": "Neither. Quantity rented falls to Qs on the supply curve, renters want Qd, and the shortage is Qd minus Qs."}, {"u": "03-supply-demand", "t": "Supply and demand", "f": "The cocoa price tripled while the quantity of cocoa sold fell. Supply or demand shock, and why was the price change so big?", "b": "Supply shock: price and quantity moved in opposite directions, and bad weather and disease are problems for sellers. The price jumped so much because demand is steep: cocoa has no close substitute in chocolate."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "What is marginal utility, and how do you compute it from a total utility table?", "b": "Marginal utility is the extra utility from one more unit. The MU of the nth unit is total utility at n minus total utility at n \u2212 1 (Sarah's second cone: 90 \u2212 50 = 40)."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Why does the demand curve slope down?", "b": "Demand is marginal benefit (marginal utility, willingness to pay), and marginal utility falls as you consume more. \"One more is never as good as the last one more.\""}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Why does the supply curve slope up?", "b": "Supply is marginal cost, and marginal cost rises because each extra unit uses resources with a higher opportunity cost (Ushi gives up $6 an hour of dish washing to collect cans)."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Define consumer surplus and say where it is on the graph.", "b": "The benefit consumers get above and beyond the price they pay: willingness to pay minus price, summed over units. It is the area under the demand curve and above the price, out to the quantity bought."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Why is the area above supply and below price called producer surplus?", "b": "Producers receive the market price on every unit but pay only the total variable cost, the area under the marginal cost curve. On each unit they get the price above that unit's marginal cost, and those gains add up to the area."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "What is total economic surplus on a graph?", "b": "CS + PS: the area between the demand (MB) curve and the supply (MC) curve, out to the quantity traded."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Demand P = 10 \u2212 Q, supply P = Q. What are the equilibrium, CS, and PS?", "b": "Q = 5 and P = $5. CS = \u00bd \u00d7 5 \u00d7 5 = 12.5, PS = \u00bd \u00d7 5 \u00d7 5 = 12.5, total surplus 25."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "What are the three conditions for allocative efficiency?", "b": "Produce up to where MB = MC; the good goes to the consumers with the highest MB; it is produced by the producers with the lowest MC."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "What is deadweight loss?", "b": "The reduction in total surplus when quantity differs from the efficient quantity: trades worth more than they cost do not happen (too little), or trades that cost more than they are worth do happen (too much)."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Which way does the deadweight loss triangle point?", "b": "Toward the efficient quantity, growing outward to the current quantity. Both too little and too much production create DWL."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "What does the First Welfare Theorem say, and what does it ignore?", "b": "A competitive equilibrium where supply equals demand maximizes total surplus, so it is efficient. It ignores equity: surplus counts dollars regardless of who gets them, and willingness to pay depends on income."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "What is the equity versus efficiency tradeoff?", "b": "Interfering with prices to make outcomes more equitable usually reduces total surplus, so we sacrifice some efficiency to get more equity."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "When is a price ceiling binding, and which curve shifts?", "b": "It binds only when set below the equilibrium price. Neither curve shifts; the market moves along both curves."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Under a binding price ceiling, what quantity is traded and what is the shortage?", "b": "Quantity traded is Q_S, the quantity supplied at the ceiling. The shortage is Q_D \u2212 Q_S."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Where is the DWL under a binding price ceiling?", "b": "The triangle between demand and supply from Q_S to the equilibrium quantity Q_1, pointing toward Q_1."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Can a price ceiling raise consumer surplus?", "b": "Yes or no: consumers gain (P_1 \u2212 P_C) \u00d7 Q_S on units still sold but lose surplus on units no longer traded. With P = 10 \u2212 Q and P = Q, a $3 ceiling raises CS to 16.5, but a $1 ceiling lowers it to 8.5. PS always falls."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Demand P = 10 \u2212 Q, supply P = Q, ceiling $3: find CS, PS, and DWL.", "b": "Q_S = 3, Q_D = 7, shortage 4. CS = \u00bd \u00d7 (7 + 4) \u00d7 3 = 16.5, PS = \u00bd \u00d7 3 \u00d7 3 = 4.5, DWL = \u00bd \u00d7 2 \u00d7 4 = 4."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "What is misallocation under a price ceiling?", "b": "With a shortage, the good is rationed by queues or luck, so it may not go to the buyers who value it most (an elderly tenant keeps a rent-controlled unit a rich student would pay more for). This loss is on top of the DWL triangle."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "What does a binding price floor do?", "b": "Set above equilibrium, it makes quantity demanded fall below quantity supplied. Quantity traded is Q_D, excess supply is Q_S \u2212 Q_D, and there is a DWL triangle from Q_D to Q_1."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Who wins and who loses from rent control?", "b": "Long-time tenants who have rent-controlled units gain; newcomers such as students and landlords lose, and there is a deadweight loss. It also shields tenants from rent swings when supply and demand shift."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "What two factors does the textbook model miss about price gouging laws (Problem Set 1)?", "b": "Consumers value fairness, and sellers may have market power after a shock (hand sanitizer and protective equipment in the pandemic). The model alone just predicts a shortage."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Why did Trader Joe's keep egg prices below market with a one-dozen limit while Denny's added surcharges?", "b": "Most Trader Joe's products contain no eggs, so the shock barely raised its marginal cost and it could absorb it; eggs are in most diner dishes, so Denny's marginal cost rose sharply. The below-market price creates a shortage rationed by the limit, and both feared price gouging accusations."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Give an example of DWL from producing too much.", "b": "Farm price supports and crop insurance lead to more output than the efficient quantity. Past that point, MC is above MB, so the extra units destroy surplus."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Supply is horizontal at a constant marginal cost. What is producer surplus?", "b": "Zero. Every unit sells at exactly its marginal cost, so there is no area between the price and the supply curve (Problem Set 2, question 3)."}, {"u": "04-surplus-price-controls", "t": "Surplus and price controls", "f": "Supply is vertical (a fixed number of apartments) and a rent cap binds. Is there a deadweight loss triangle?", "b": "No. The same number of apartments is rented, so the cap mostly moves surplus from landlords to renters. The loss comes from misallocation: with a shortage, apartments may not go to the families who value them most."}, {"u": "05-elasticity", "t": "Elasticity", "f": "What is the price elasticity of demand, in words and as a formula?", "b": "It is the percent change in quantity demanded caused by a 1% change in price: \u03b5 = %\u0394Q \u00f7 %\u0394P. Quantity goes on top because quantity responds to price."}, {"u": "05-elasticity", "t": "Elasticity", "f": "How do you compute a percentage change for Edwards' elasticity questions?", "b": "Divide the change by the starting value: (new \u2212 old) \u00f7 old. His Fall 2025 key uses these simple percent changes, not the midpoint method."}, {"u": "05-elasticity", "t": "Elasticity", "f": "Lunch rises from $10 to $11 and quantity falls from 50,000 to 47,500. What is \u03b5?", "b": "Price +10%, quantity \u22125%, so \u03b5 = \u22125% \u00f7 10% = \u22120.5. Its size is below 1, so demand is relatively inelastic."}, {"u": "05-elasticity", "t": "Elasticity", "f": "Should you report demand elasticity with or without the minus sign?", "b": "Write both: the Fall 2025 key keeps the minus (\u22120.5) and the Class 6 slide uses absolute value (0.5). Classify by size: compare |\u03b5| to 1."}, {"u": "05-elasticity", "t": "Elasticity", "f": "What do elastic, inelastic, and unit elastic mean?", "b": "Elastic: |\u03b5| above 1, quantity changes by a bigger percent than price. Inelastic: |\u03b5| below 1. Unit elastic: |\u03b5| = 1, quantity changes by exactly the same percent."}, {"u": "05-elasticity", "t": "Elasticity", "f": "What did Edwards tell the class to write on the cheat sheet about elasticity?", "b": "Inelastic means steep and elastic means flat."}, {"u": "05-elasticity", "t": "Elasticity", "f": "What is the formula linking elasticity and slope?", "b": "\u03b5 = (1/slope) \u00d7 (P/Q). It uses one over the slope because price is on the vertical axis, so the slope is \u0394P \u00f7 \u0394Q."}, {"u": "05-elasticity", "t": "Elasticity", "f": "Does a straight demand line have the same elasticity everywhere?", "b": "No. The slope is constant but P/Q changes, so demand is more elastic at high prices (upper left) and less elastic at low prices, with unit elasticity at the midpoint."}, {"u": "05-elasticity", "t": "Elasticity", "f": "For demand P = 12 \u2212 Q, what is \u03b5 at Q = 4, Q = 6, and Q = 8?", "b": "\u22121 \u00d7 8/4 = \u22122 (elastic), \u22121 \u00d7 6/6 = \u22121 (unit elastic), and \u22121 \u00d7 4/8 = \u22120.5 (inelastic)."}, {"u": "05-elasticity", "t": "Elasticity", "f": "What are the elasticities of vertical and horizontal curves?", "b": "A vertical curve has elasticity 0 (perfectly inelastic). A horizontal curve has infinite elasticity (perfectly elastic), since its slope is 0 and 1 \u00f7 0 is infinite."}, {"u": "05-elasticity", "t": "Elasticity", "f": "Demand is vertical and supply shifts inward. What happens to price and quantity?", "b": "Quantity does not change at all, and the price rises a lot. This was a Class 6 poll that fooled many students."}, {"u": "05-elasticity", "t": "Elasticity", "f": "With steep (inelastic) demand, what does a supply shift do compared with flat demand?", "b": "With steep demand, price changes a lot and quantity a little. With flat demand, price changes a little and quantity a lot."}, {"u": "05-elasticity", "t": "Elasticity", "f": "What makes demand inelastic?", "b": "No close substitute, the good is a need (food, gas to commute, health care), or a short time to adjust. Eggs and short-run gasoline are his examples."}, {"u": "05-elasticity", "t": "Elasticity", "f": "Why is demand for one lunch spot more elastic than demand for lunch out in general?", "b": "A narrow good has close substitutes within its category: if one spot raises prices you go to the next. Edwards guessed \u22121.5 or more for one spot, while lunch out in general was \u22120.5."}, {"u": "05-elasticity", "t": "Elasticity", "f": "How do you use elasticity to find a price change from a quantity shock?", "b": "Solve the formula for price: %\u0394P = %\u0394Q \u00f7 \u03b5. With \u03b5 = \u22120.5, a supply shock that cuts quantity 10% raises price by 20%."}, {"u": "05-elasticity", "t": "Elasticity", "f": "How does total spending change when price changes?", "b": "%\u0394(P \u00d7 Q) \u2248 %\u0394P + %\u0394Q. With inelastic demand a price rise raises spending; with elastic demand it lowers spending; at unit elasticity spending is unchanged."}, {"u": "05-elasticity", "t": "Elasticity", "f": "Price rises 1%. What happens to spending if \u03b5 = \u22120.75, \u22121.5, or \u22123?", "b": "About +0.25%, \u22120.5%, and \u22122%, found by adding the signed percent changes."}, {"u": "05-elasticity", "t": "Elasticity", "f": "When should you not use the %\u0394P + %\u0394Q shortcut?", "b": "For big changes, like a 33% or 100% price jump. Then multiply P \u00d7 Q before and after."}, {"u": "05-elasticity", "t": "Elasticity", "f": "Gas rises from $3 to $4, a driver buys 50 gallons a month, and \u03b5 = \u22120.37. What happens?", "b": "Price +33%, so quantity falls about 12%, to about 44 gallons. Spending goes from $150 to about $175, so it rises, but the driver still cuts back."}, {"u": "05-elasticity", "t": "Elasticity", "f": "What was wrong with the Brown University fuel spending projection?", "b": "It multiplied the price increase by the old quantity, assuming quantity demanded stays the same. Quantity falls when price rises, so this overstates extra spending unless demand is perfectly inelastic."}, {"u": "05-elasticity", "t": "Elasticity", "f": "What is the price elasticity of supply and what sign does it have?", "b": "\u03b5_S = %\u0394Q_S \u00f7 %\u0394P. It is positive, because a higher price brings a larger quantity supplied."}, {"u": "05-elasticity", "t": "Elasticity", "f": "Why is supply usually less elastic in the short run than in the long run?", "b": "In the short run sellers face resource constraints (crops already planted, oil wells not yet drilled), so marginal cost rises sharply. In the long run they can expand, enter, or adopt new technology like fracking."}, {"u": "05-elasticity", "t": "Elasticity", "f": "Give an example of perfectly inelastic supply and of nearly perfectly elastic supply from class.", "b": "Cal football tickets (a fixed number of seats) are perfectly inelastic. Soda sold in Berkeley is nearly perfectly elastic, because Coca-Cola and PepsiCo can sell elsewhere."}, {"u": "05-elasticity", "t": "Elasticity", "f": "If demand for an illicit drug is inelastic, what does a crackdown that raises its price do to total spending on it?", "b": "Spending rises, because the percent drop in quantity is smaller than the percent rise in price."}, {"u": "05-elasticity", "t": "Elasticity", "f": "Only supply shifts, and price rises from $4 to $6 while quantity falls from 3 to 2.7. What is the elasticity of demand?", "b": "Both points are on the demand curve, so \u03b5 = \u221210% \u00f7 50% = \u22120.2. Demand is inelastic, so the curve is steep."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "What is a per-unit tax on a supply and demand graph?", "b": "A vertical wedge equal to the tax, placed at the new quantity Q2 where the gap between demand (above) and supply (below) equals the tax. Buyers pay the price on demand; sellers keep the price on supply."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Does it matter whether a tax is collected from buyers or sellers?", "b": "No. A tax on sellers shifts supply up by the tax; a tax on buyers shifts demand down by the tax. Both give the same quantity, buyer price, and seller price."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "What is the general rule for tax incidence?", "b": "The more inelastic side of the market bears more of the tax, and the elastic side avoids it. If both are about equally elastic, they split it roughly evenly."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Who pays the Berkeley soda tax, and why?", "b": "Consumers pay all of it. Coca-Cola and PepsiCo can sell elsewhere (San Leandro), so supply to Berkeley is perfectly elastic (flat)."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Who bears a Berkeley tax on beer from a local brewery?", "b": "Mostly the brewery. It plans brews in advance and sells locally, so its supply is inelastic, and the price it keeps falls by most of the tax."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Who bears most of the 12.4% payroll tax?", "b": "Workers, because labor supply is inelastic. The law's 50-50 split between employer and worker does not decide who really pays."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "What does the European gasoline evidence suggest?", "b": "European taxes and pump prices are both much higher than in the U.S., so drivers bear most of the tax. Gas supply (world oil price plus station costs) is much more elastic than demand."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "With perfectly elastic (flat) supply, who bears a tax?", "b": "Buyers bear all of it: their price rises by the full tax while sellers keep the old price. Quantity falls and there is a DWL."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "With a vertical supply or demand curve, what happens under a tax?", "b": "The vertical side bears the whole tax, quantity does not change, and the DWL is zero."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "What is tax revenue on the graph?", "b": "Tax \u00d7 Q2: the rectangle between the buyers' price and the sellers' price from 0 to Q2. It is a transfer to the government, not a loss."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "What is the DWL of a tax, in plain words?", "b": "The surplus from trades that would have happened without the tax but no longer do, the triangle from Q2 to Q1. Edwards: you skip buying it because of the tax, no other reason."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Why is DWL larger when demand or supply is elastic?", "b": "DWL = \u00bd \u00d7 tax \u00d7 (Q1 \u2212 Q2). Elastic curves make quantity fall more for the same tax, so the triangle is wider. That is why taxing inelastic goods like cigarettes is more efficient."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Does a tax cause misallocation?", "b": "No. The price still rations the good, so the units still traded go to the highest-value buyers and lowest-cost sellers. A binding price ceiling can misallocate."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Demand P = 10 \u2212 Q, supply P = Q, $2 tax: what are Q, the prices, revenue, and DWL?", "b": "10 \u2212 Q = Q + 2 gives Q = 4. Buyers pay $6, sellers keep $4. Revenue 8, CS 8, PS 8, DWL 1."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "How do you set up a tax problem with equations?", "b": "Set the demand price equal to the supply price plus the tax, solve for Q2, then read the buyer price off demand and the seller price off supply."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Same curves (P = 10 \u2212 Q, P = Q), $2 subsidy: what are the results?", "b": "(10 \u2212 Q) + 2 = Q gives Q = 6. Buyers pay $4, sellers receive $6, cost 2 \u00d7 6 = 12, DWL 1."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Why does a subsidy create deadweight loss?", "b": "It pushes quantity above the efficient level, so on the extra units MB < MC: they cost more to produce than buyers value them. The gains to buyers and sellers are less than the subsidy's cost."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Problem Set 2: demand P = 5 \u2212 Q, MC = 1, $2 tax paid by producers. Results?", "b": "Q = 2, buyers pay 3, producers keep 1. Consumers bear all of it (flat supply). CS = 2, PS = 0, revenue = 4, DWL = 2."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "What did the Finnish hairdresser VAT study find?", "b": "A 14-point VAT cut was only about 50% passed on to consumers, but the later increase was almost fully passed on. The competitive model is not gospel."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "In the EU gas tax scatter, what does a slope of 1 mean?", "b": "Each euro of tax raises the price by a euro, so consumers bear the whole tax (as with perfectly elastic supply)."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Why is the EU gas tax and price slope about 1.3, steeper than one-for-one?", "b": "Selection: less advanced EU countries have cheaper land and labor (cheaper gas) and also lower gas taxes, so the line mixes the tax effect with cost differences."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Does the price buyers pay rise by the full amount of a tax?", "b": "Usually not. It typically rises by less than the tax, depending on elasticities. It rises by the full tax only if supply is flat or demand is vertical."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Flat supply at MC = $2, demand P = 10 \u2212 Q, and a $4 tax said to be paid by sellers. What are Q, the prices, revenue, and DWL?", "b": "10 \u2212 Q = 6 gives Q = 4. Buyers pay $6 and sellers keep $2, so buyers bear all of it. Revenue 16, CS 8, PS 0, DWL 8 (original CS was 32)."}, {"u": "06-taxes-subsidies", "t": "Taxes and subsidies", "f": "Why does a tax on gas sold only in Berkeley fall mostly on Berkeley gas stations?", "b": "Drivers can fill up in Albany or Oakland, so demand for gas sold in Berkeley is very elastic (flat). The flat side avoids the tax, so sellers bear most of it."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "What is the budget constraint equation with food and clothing?", "b": "P_f \u00d7 q_f + P_c \u00d7 q_c = Income. The household spends all of its income on the two goods."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "On Edwards's budget line, which good is on which axis, and what are the intercepts?", "b": "Food is vertical and clothing is horizontal. The food intercept is Income \u00f7 P_f and the clothing intercept is Income \u00f7 P_c."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "What is the slope of the budget line (food vertical, clothing horizontal)?", "b": "\u2212P_c \u00f7 P_f, the price of the horizontal good over the price of the vertical good. It is a relative price: the meals you give up for one more unit of clothing."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "Income $100, food $20, clothing $50: intercepts and slope?", "b": "5 meals ($100 \u00f7 $20), 2 units of clothing ($100 \u00f7 $50), and slope \u22122.5."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "What does a rise in income do to the budget line?", "b": "It shifts the line out in parallel. Both intercepts move out and the slope stays the same because prices did not change."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "What does a rise in the price of clothing do to the budget line?", "b": "Only the clothing intercept moves in. The line pivots clockwise around the fixed food intercept and gets steeper."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "What happens to the budget line if both prices double and income stays the same?", "b": "Both intercepts are cut in half and the slope is unchanged, so the line shifts in parallel, exactly as if income were halved."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "What is the difference between total utility and marginal utility?", "b": "Total utility is the level of well-being. Marginal utility is the extra utility from one more unit, the rate of change of total utility."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "Why does total utility rise, and why does marginal utility fall?", "b": "Total utility rises because more is always better. Marginal utility falls because one more is never as good as the last one more (diminishing marginal utility)."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "Sarah's total utility is 50, 90, 120, 140, 150, 140 for 1 to 6 cones. What are the marginal utilities?", "b": "50, 40, 30, 20, 10, and \u221210. Total utility peaks at 5 cones; the sixth cone has negative marginal utility."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "How is the demand curve related to marginal utility?", "b": "The demand curve is the marginal utility curve: its height at each quantity is willingness to pay, which is that unit's marginal utility. It slopes down because MU falls."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "State the Rational Spending Rule.", "b": "MU_a \u00f7 P_a = MU_b \u00f7 P_b for every good bought. The marginal utility from the last dollar spent is the same on every good."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "Why must marginal utility per dollar be equal across goods?", "b": "If one good gave more extra happiness per dollar, moving a dollar toward it would make you happier at the same total spending. You stop only when the ratios are equal."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "The price of clothing rises. How do you restore the Rational Spending Rule?", "b": "MU_c \u00f7 P_c has fallen, so buy less clothing, which raises MU_c, and possibly more food, which lowers MU_f, until the ratios are equal."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "The price of a good rises and you buy less of it. What happens to its marginal utility?", "b": "It rises. You move up your demand curve to the northwest, where its height (marginal utility) is higher. Half the class missed this poll."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "Fall 2025 midterm 1(c): the price of clothing falls. What do you do?", "b": "The left side MU_c \u00f7 P_c rises, so buy more clothing. That lowers MU_c and brings the left side back to equality."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "Why is 'buy more X so that MU of X rises' wrong?", "b": "It is internally inconsistent. Buying more of a good always lowers its marginal utility."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "MU of clothing is 10 at $50 and MU of food is 2 at $10. Optimal? What if clothing rises to $55?", "b": "Yes: both give 0.2 utils per dollar. At $55, 10 \u00f7 55 \u2248 0.18 is less than 0.2, so buy less clothing until its MU rises to 11 (11 \u00f7 55 = 0.2)."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "Problem Set 2 Q2: the price of electricity rises. What does the household do?", "b": "MU_E \u00f7 P_E falls, so it buys less electricity (MU_E rises) and more of everything else (MU_ee falls). This is a movement along the electricity demand curve."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "Problem Set 2 Q2: a heatwave hits a household with air conditioning. What happens?", "b": "MU of electricity rises at every quantity, so demand for electricity shifts out. The household buys more electricity and less of everything else."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "With log utility u(c) = log(c), what is marginal utility?", "b": "MU = 1/c. Log means the natural log (the ln key), and MU falls as consumption rises."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "Alice consumes $400 and Bob $160, with MU = 1/c. What are their MUs?", "b": "Alice: 1/400 = 0.0025. Bob: 1/160 = 0.00625. Bob's is higher because he consumes less."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "What transfer maximizes Alice's plus Bob's utility ($400 and $160, identical log utility)?", "b": "$120 from Alice to Bob, leaving $280 each. The marginal benefit (Bob's MU) equals the marginal cost (Alice's MU) only when their consumption is equal."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "Income doubles and the price of clothing doubles at the same time (food price unchanged). What happens to the budget line?", "b": "The food intercept doubles and the clothing intercept ends up where it started. Shift out in parallel for the income, then pivot in on clothing: the line pivots outward around the clothing intercept and gets steeper."}, {"u": "07-households", "t": "Households and the Rational Spending Rule", "f": "Your income and every price rise by the same percentage. What happens to the budget line?", "b": "Nothing. Each intercept is income over a price and the slope is a ratio of prices, so all of them stay the same."}, {"u": "08-firms", "t": "Competitive firms", "f": "What is a firm's profit, and what goes into total cost?", "b": "Profit = total revenue \u2212 total cost. Total cost is the opportunity cost of all inputs, including the owner's own time and money, so the wage a family farmer could earn elsewhere counts as a cost."}, {"u": "08-firms", "t": "Competitive firms", "f": "What demand curve does one small competitive firm see?", "b": "A flat (perfectly elastic) demand curve at the market price, even though market demand slopes down. The firm is too small to move the price."}, {"u": "08-firms", "t": "Competitive firms", "f": "What is marginal revenue for a price-taking firm?", "b": "MR = P. Selling one more unit brings in exactly the market price and does not lower the price on any other unit."}, {"u": "08-firms", "t": "Competitive firms", "f": "What rule does every profit-maximizing firm follow?", "b": "Produce where marginal revenue equals marginal cost. For a competitive firm, MR = P, so it produces where P = MC."}, {"u": "08-firms", "t": "Competitive firms", "f": "Why is producing where P = MC best for a competitive firm?", "b": "If the next unit's MC is below P, making it adds to profit; if the last unit's MC is above P, it lost money. Profit is highest where they are equal."}, {"u": "08-firms", "t": "Competitive firms", "f": "What is the difference between fixed and variable costs?", "b": "Fixed costs do not change with output (the oil pump, the shack, a building). Variable costs rise with output (workers, feed, supplies)."}, {"u": "08-firms", "t": "Competitive firms", "f": "Does a change in fixed cost change how much a firm produces?", "b": "No. Fixed cost does not change marginal cost, so the firm still produces where P = MC. It changes only profit and the decision to enter or exit."}, {"u": "08-firms", "t": "Competitive firms", "f": "What is the area under the MC curve?", "b": "Total variable cost of the units produced."}, {"u": "08-firms", "t": "Competitive firms", "f": "What shape does MC have in Econ 2?", "b": "Always upward sloping. MC may fall at first from economies of scale, but Edwards assumes rising MC because the competitive model works badly with falling MC."}, {"u": "08-firms", "t": "Competitive firms", "f": "Why is a competitive firm's supply curve its MC curve?", "b": "At each price the firm produces where P = MC, so each price picks a quantity on the MC curve. Read vertically, the price needed to get a quantity is the MC of that unit."}, {"u": "08-firms", "t": "Competitive firms", "f": "How do you get market supply from firm supply curves?", "b": "Add them horizontally: at each price, add up every firm's quantity. Market supply is the industry's marginal cost curve."}, {"u": "08-firms", "t": "Competitive firms", "f": "100 identical firms each have MC of $5 at 1,000 units and $6 at 2,000 units. What is industry supply at $5 and $6?", "b": "100,000 units at $5 and 200,000 units at $6 (each firm's quantity times 100)."}, {"u": "08-firms", "t": "Competitive firms", "f": "When does a competitive firm enter the industry?", "b": "When the area between the price and its MC curve up to its output (revenue minus variable cost, Edwards' 'total marginal profit') is bigger than its fixed cost."}, {"u": "08-firms", "t": "Competitive firms", "f": "How are profit and producer surplus different?", "b": "Producer surplus is revenue minus variable cost. Profit is revenue minus total cost, so profit = producer surplus \u2212 fixed cost."}, {"u": "08-firms", "t": "Competitive firms", "f": "What does entry of new firms do to each firm's MC and to market supply?", "b": "Each firm's MC does not change. Market supply shifts right because more firms are added up."}, {"u": "08-firms", "t": "Competitive firms", "f": "What do better technology and a higher input price do to supply?", "b": "Technology every firm uses shifts firm MC and market supply down (right): price falls, quantity rises. A higher input price every firm pays does the reverse."}, {"u": "08-firms", "t": "Competitive firms", "f": "What happens in the long run when firms in a competitive industry earn positive profits?", "b": "New firms enter, market supply shifts right, the price falls, and profits shrink until they are zero. Losses cause exit and the reverse."}, {"u": "08-firms", "t": "Competitive firms", "f": "What does 'zero profit' mean in the long run?", "b": "Zero excess profit. Owners still earn a normal return on their time and money, because those returns are counted as costs."}, {"u": "08-firms", "t": "Competitive firms", "f": "Fall 2025 midterm: is the marginal cost of an egg high or low?", "b": "Low. Once the farm exists, an extra egg needs only feed, water, and care for a hen that lays about one egg a day. So egg supply slopes up and sits low."}, {"u": "08-firms", "t": "Competitive firms", "f": "Fall 2025 midterm: how much of a barrier to entry is the fixed cost of a California chicken farm?", "b": "A big barrier over a year or two, because California land is expensive. Much less of a barrier over 5 years, when new farms have time to buy land and build."}, {"u": "08-firms", "t": "Competitive firms", "f": "Why did Denny's add an egg surcharge while Trader Joe's kept egg prices below market with a one-dozen limit?", "b": "Eggs are in most Denny's dishes, so the egg shock strongly raised its marginal cost. Most Trader Joe's products have no eggs, so it could absorb the cost or run out. Both feared price gouging accusations."}, {"u": "08-firms", "t": "Competitive firms", "f": "Diesel prices rise for every farm. What happens to one small family farm?", "b": "Its MC shifts up, but it faces a flat demand at the world price and cannot raise its own price, so it produces less and absorbs the cost. Market supply shifts up, price rises, quantity falls."}, {"u": "08-firms", "t": "Competitive firms", "f": "A fixed cost rises (rent, a permit fee, a property tax). What happens to a competitive firm's output and profit?", "b": "Output stays the same because marginal cost did not change, so P = MC gives the same quantity. Profit falls by the amount of the increase, which matters only for entry and exit."}, {"u": "08-firms", "t": "Competitive firms", "f": "Is the wage an owner pays herself part of economic profit?", "b": "No. It is the return to her labor, an input, counted as a cost at its opportunity cost. Profit is what is left after every input, including her time, is paid."}, {"u": "09-monopoly", "t": "Monopoly", "f": "What is a monopoly, and what makes monopoly power strong?", "b": "A monopoly is the only seller of a product with no close substitutes, so it faces the whole downward-sloping market demand curve. Its power is stronger the fewer close substitutes buyers have."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Name the main sources of market power and barriers to entry.", "b": "No close substitutes, patents and other legal protections, high fixed costs (railways), licenses and gatekeeping (doctors), network effects (Facebook, rideshares), and natural monopoly (PG&E)."}, {"u": "09-monopoly", "t": "Monopoly", "f": "What is a natural monopoly?", "b": "A market where one producer can supply the whole market at a lower average cost than several firms could, usually because fixed costs are huge and marginal cost is low. Examples: PG&E power lines, railways, software."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Why is a monopolist's marginal revenue below its price?", "b": "It must charge everyone the same price, so to sell one more unit it has to cut the price on all the earlier units too. MR is the new unit's price minus the revenue lost on the earlier units."}, {"u": "09-monopoly", "t": "Monopoly", "f": "What happens to a monopolist's price and quantity when its marginal cost rises?", "b": "MR = MC happens at a smaller quantity, and the price read off demand at that quantity is higher. Quantity falls and price rises, usually by less than the cost increase."}, {"u": "09-monopoly", "t": "Monopoly", "f": "If demand is P = a \u2212 bQ, what is MR?", "b": "MR = a \u2212 2bQ: the same vertical intercept as demand and twice as steep, so it hits the quantity axis halfway to demand's quantity intercept."}, {"u": "09-monopoly", "t": "Monopoly", "f": "What are the two steps to find the monopoly outcome?", "b": "First, find the quantity where MR = MC. Second, go straight up to the demand curve and read the price buyers will pay for that quantity."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Class notebook: demand P = 6 \u2212 Q/4, MC = Q/4. What are the monopoly Q and P?", "b": "MR = 6 \u2212 Q/2 equals MC at Q = 8 (both are $2). The price is read off demand: P = $4, not $2."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Class notebook: what are profit, the efficient quantity, and the deadweight loss?", "b": "Profit = 32 \u2212 8 = 24 (revenue minus the triangle under MC). Efficient Q = 12 at P = $3, where demand meets MC. DWL = \u00bd \u00d7 4 \u00d7 2 = 4."}, {"u": "09-monopoly", "t": "Monopoly", "f": "With constant MC = c and demand P = a \u2212 bQ, what are the monopoly Q and P?", "b": "Qm = (a \u2212 c) \u00f7 2b and Pm = (a + c) \u00f7 2. The competitive quantity (a \u2212 c) \u00f7 b is twice Qm."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Compared with perfect competition, what does a monopoly do?", "b": "It sells a smaller quantity at a higher price, above marginal cost. That creates a deadweight loss and transfers part of consumer surplus to the monopolist."}, {"u": "09-monopoly", "t": "Monopoly", "f": "In the a to h monopoly graph, what are consumer surplus, producer surplus, and DWL under monopoly?", "b": "Consumer surplus is a + b, producer surplus is c + d + f + g, and deadweight loss is e + h. Under competition consumer surplus is a + b + c + d + e and producer surplus is f + g + h."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Which area in the a to h graph is a transfer, and why is it not a loss?", "b": "Area c + d is consumer surplus under competition but producer surplus under monopoly. It changes hands from consumers to the monopolist, so total surplus does not fall because of it."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Why does a monopoly create deadweight loss?", "b": "Between the monopoly quantity and the efficient quantity, willingness to pay is above marginal cost, but those units are not produced because selling them would force a price cut on all units. The monopolist gains less than consumers lose."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Taylor Swift (Fall 2025 midterm): what were the monopoly quantity and price, and the implied demand?", "b": "10 million tickets at $200 ($2 billion \u00f7 10 million). With MR = MC = $100 at 10 million, demand is P = 300 \u2212 10Q and MR = 300 \u2212 20Q (Q in millions)."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Taylor Swift: with zero fixed costs, what was profit?", "b": "Revenue $2 billion minus total cost, the triangle under MC (\u00bd \u00d7 10 million \u00d7 $100 = $500 million), so $1.5 billion. The key also accepted $1 billion."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Taylor Swift: what was the efficient number of tickets?", "b": "15 million, where demand meets MC at $150. The monopoly cut quantity by a third, to 10 million."}, {"u": "09-monopoly", "t": "Monopoly", "f": "With zero fixed cost, how do you compute profit when MC slopes up?", "b": "Profit = price \u00d7 quantity minus the area under MC from 0 to the quantity. The (P \u2212 MC) \u00d7 Q box only works when MC is flat."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Problem Set 2 Q3(e): demand P = 5 \u2212 Q, MC = $1. What is the monopoly outcome?", "b": "MR = 5 \u2212 2Q = 1 gives Q = 2 and P = $3. Consumer surplus 2, profit 4, deadweight loss 2 (competition was Q = 4, P = $1)."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Does a fixed cost change the monopolist's quantity or price?", "b": "No. Fixed costs do not affect MC or MR, so MR = MC gives the same Q and P. Only profit changes."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Why does a monopolist have no supply curve?", "b": "It does not take price as given. For each demand curve it picks one point using MR = MC, so there is no price-quantity schedule to move along."}, {"u": "09-monopoly", "t": "Monopoly", "f": "What happens when demand for a monopolist's product rises (Humira)?", "b": "Demand and MR shift out, the new MR = MC quantity is larger, and the price read off the higher demand is higher. Both P and Q rise."}, {"u": "09-monopoly", "t": "Monopoly", "f": "Why grant patents if monopoly causes deadweight loss?", "b": "Inventions like drugs have high fixed research costs and low marginal costs. A temporary monopoly lets the inventor earn back the research cost, at the price of high prices and deadweight loss while the patent lasts."}, {"u": "09-monopoly", "t": "Monopoly", "f": "A monopolist sells a digital good with MC = $0 and demand P = 40 \u2212 Q. What are its Q and P, and the efficient Q?", "b": "MR = 40 \u2212 2Q = 0 gives Q = 20 and P = $20. The efficient quantity is 40, where demand meets MC at $0, so the deadweight loss is \u00bd \u00d7 20 \u00d7 20 = 200."}, {"u": "09-monopoly", "t": "Monopoly", "f": "In the Google antitrust case (Problem Set 2), was the main concern consumer prices?", "b": "No. The concern was Google's dominance of search, such as paying to be the iPhone's default search engine. The prices discussed were ad prices, not prices consumers pay."}, {"u": "10-externalities", "t": "Externalities", "f": "What is an externality?", "b": "A cost or benefit from market activity that falls on people outside the market. The buyers and sellers do not pay it or enjoy it, so the market price leaves it out."}, {"u": "10-externalities", "t": "Externalities", "f": "What do private and social mean in this unit?", "b": "Private means the people in the market: buyers, sellers, and the government if there is a tax or subsidy. Social means everyone, inside and outside the market."}, {"u": "10-externalities", "t": "Externalities", "f": "Write the formulas for social marginal cost and social marginal benefit.", "b": "SMC = PMC + EMC and SMB = PMB + EMB, where EMC and EMB are the external marginal cost and benefit."}, {"u": "10-externalities", "t": "Externalities", "f": "Where does the market produce, and where is the efficient quantity?", "b": "The market produces where PMB = PMC (demand meets supply). The efficient quantity Q* is where SMB = SMC."}, {"u": "10-externalities", "t": "Externalities", "f": "Which curve does a negative externality affect, and what does the market do?", "b": "The cost (supply) side: SMC lies above PMC. The market overproduces, so Q1 is greater than Q*."}, {"u": "10-externalities", "t": "Externalities", "f": "Which curve does a positive externality affect, and what does the market do?", "b": "The benefit (demand) side: SMB lies above PMB. The market underproduces, so Q1 is less than Q*."}, {"u": "10-externalities", "t": "Externalities", "f": "Where is the deadweight loss triangle for a negative externality?", "b": "Between Q* and Q1, below SMC and above demand, with its point at the social optimum."}, {"u": "10-externalities", "t": "Externalities", "f": "Where is the deadweight loss triangle for a positive externality?", "b": "Between Q1 and Q*, below SMB and above supply, pointing to the social optimum."}, {"u": "10-externalities", "t": "Externalities", "f": "With a constant EMC, what is the deadweight loss of a negative externality?", "b": "DWL = \u00bd \u00d7 EMC \u00d7 (Q1 \u2212 Q*)."}, {"u": "10-externalities", "t": "Externalities", "f": "How do you compute total surplus when there is an externality?", "b": "Total surplus = CS + PS + tax revenue \u2212 external cost. The external cost at any Q is the area between SMC and PMC, which is EMC \u00d7 Q if EMC is constant."}, {"u": "10-externalities", "t": "Externalities", "f": "Is the optimal amount of pollution zero? (Fall 2025 midterm 1(g))", "b": "Usually not. The optimal quantity is where social marginal cost equals social marginal benefit (willingness to pay), which is typically nonzero and finite. It could be zero, but there is no reason it must be."}, {"u": "10-externalities", "t": "Externalities", "f": "How big should a Pigouvian tax be?", "b": "A per-unit tax equal to the external marginal cost at the efficient quantity Q*. If EMC is constant, the tax equals EMC."}, {"u": "10-externalities", "t": "Externalities", "f": "How big should a Pigouvian subsidy be?", "b": "A per-unit subsidy equal to the external marginal benefit at Q*. It lifts demand from PMB up to SMB."}, {"u": "10-externalities", "t": "Externalities", "f": "What does a Pigouvian tax do on the graph?", "b": "It shifts supply up from PMC onto SMC, so the market trades Q* and the deadweight loss disappears. Revenue = tax \u00d7 Q*."}, {"u": "10-externalities", "t": "Externalities", "f": "Problem Set 2 Q3(d): demand P = 5 \u2212 Q, MC = 1, pollution $2 per unit. What are the market outcome and DWL?", "b": "The market stays at Q = 4, P = $1, with CS 8, PS 0, and external cost $8. SMC = 3, so Q* = 2 and DWL = 2. A $2 per-unit tax restores efficiency."}, {"u": "10-externalities", "t": "Externalities", "f": "Problem Set 2 Q3(f): the same market with a monopolist and $2 pollution. What happens?", "b": "MR = 5 \u2212 2Q = 1 gives Q = 2 and P = $3, which is exactly where SMC = 3 meets demand. The outcome is efficient by coincidence: CS 2, profit 4, external cost 4, net surplus 2, DWL 0."}, {"u": "10-externalities", "t": "Externalities", "f": "Does Problem Set 2 Q3(f) show that the Standard Oil monopoly was good?", "b": "No. The match depended on the external cost being exactly $2. With other numbers the monopoly is inefficient, and a Pigouvian tax targets the pollution directly."}, {"u": "10-externalities", "t": "Externalities", "f": "What is the Coase theorem?", "b": "If property rights are clearly defined, private negotiation can solve externalities. Negotiation can be costly, so it helps to define property rights in the right way."}, {"u": "10-externalities", "t": "Externalities", "f": "What was Elinor Ostrom's point?", "b": "Communities that interact over the long run can manage shared resources through trust and their own rules; people are not hopelessly trapped. Edwards said it is not likely on the exam unless the question explains it."}, {"u": "10-externalities", "t": "Externalities", "f": "How does cap and trade work, and when is it efficient?", "b": "Emitters get tradable permits for a fixed total of pollution, so everyone faces the same permit price and cuts happen where they are cheapest. It is efficient if the cap makes the permit price equal the social marginal cost."}, {"u": "10-externalities", "t": "Externalities", "f": "Why does a subsidy for a positive externality reduce deadweight loss, when an ordinary subsidy creates it?", "b": "With a positive externality the market stops too early, where social marginal benefit is still above marginal cost. A subsidy equal to the external marginal benefit moves it to SMB = MC. Without an externality the market is already efficient, so a subsidy overshoots."}, {"u": "10-externalities", "t": "Externalities", "f": "Does a full Pigouvian tax (equal to EMC) fix pollution from a monopolist?", "b": "Not necessarily. The monopolist already restricts output by setting MR = private MC, so taxing it by the full external cost can push output below the efficient quantity and raise deadweight loss."}, {"u": "10-externalities", "t": "Externalities", "f": "Why does discounting matter for the optimal carbon tax?", "b": "Most CO2 damage is in the future. Heavy discounting makes that damage small today, so the optimal tax is small; little discounting makes the optimal carbon tax big."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "Price and quantity both rise in a market. Which curve shifted?", "b": "Demand shifted right. Only a demand shift moves price and quantity in the same direction; a supply shift moves them in opposite directions."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "Price rises and quantity falls. Which curve shifted?", "b": "Supply shifted left (up), for example because of a cost increase like a shortage of an input."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "Why can't you compute the price elasticity of demand from two points where demand shifted?", "b": "The two points lie on different demand curves, so they trace out the supply curve instead. You need a supply shift, which moves the market along a fixed demand curve."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "How do you get the percent price change from a quantity shock and an elasticity?", "b": "Turn the definition around: %\u0394P = %\u0394Q \u00f7 \u03b5. A 10% cut in quantity with \u03b5 = \u22120.4 raises the price 25%."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "Price rises 20% and quantity falls 10%. What happens to spending, and what does that say about elasticity?", "b": "Spending rises, by roughly 20% \u2212 10% = 10% (exactly 8%). Elasticity is \u22120.5, so demand is inelastic."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "Who bears a tax when supply is perfectly inelastic (vertical), as with a fixed number of hotel rooms?", "b": "Sellers bear all of it. Buyers pay the same total price, and the price sellers keep falls by the full tax, no matter who hands the tax to the government."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "Who bears a tax when supply is perfectly elastic (flat marginal cost)?", "b": "Buyers bear all of it. The price rises by the full tax, sellers keep the same price, and producer surplus stays zero."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "Under a price ceiling below equilibrium, which curve gives the quantity actually sold?", "b": "The supply curve. Sellers sell only what they are willing to supply at the capped price; the gap up to quantity demanded is the shortage. Neither curve shifts."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "A monopolist sells 100 units at $10 and must cut to $9.95 to sell 101. What is MR of the 101st unit?", "b": "$4.95: it gains $9.95 on the new unit but loses $0.05 on each of the other 100 ($5.00)."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "Monopoly method with linear demand P = a \u2212 bQ and constant MC?", "b": "MR = a \u2212 2bQ (twice as steep). Set MR = MC to find Q, then read the price off demand. Profit = (P \u2212 MC) \u00d7 Q when marginal cost is flat and fixed cost is zero."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "What is the Pigouvian tax for a negative externality?", "b": "A per-unit tax equal to the external marginal cost at the efficient quantity. It moves a competitive market from the market quantity to Q*, where SMC meets demand."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "Why can a Pigouvian tax make things worse when the seller is a monopoly?", "b": "A monopoly already produces less than the competitive amount. Taxing it pushes output even further below, so it can overshoot the efficient quantity and raise deadweight loss."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "What does the Coase theorem say?", "b": "If property rights are clearly defined and bargaining is cheap, the affected parties can negotiate to the efficient outcome, whichever side holds the right."}, {"u": "13-mock-2", "t": "Practice midterm B", "f": "Why does a single boba shop face more elastic demand than the boba market as a whole?", "b": "Other shops on the block sell nearly identical drinks, so one shop's customers leave if it raises its price. For the whole market the substitutes are different drinks, so quantity falls less."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "On the Fall 2025 midterm, which curve slopes downward and why?", "b": "Demand, because marginal benefit (willingness to pay, marginal utility) falls as quantity rises. More is better, but at a decreasing rate."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Lunch price rises from $10 to $11 and quantity falls from 50,000 to 47,500. What is the elasticity?", "b": "Price rises 10% and quantity falls 5%, so the elasticity is \u22125% \u00f7 10% = \u22120.5. The magnitude is below 1, so demand is relatively inelastic."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Under the Rational Spending Rule, the price of clothing falls. What do you do?", "b": "Buy more clothing. The lower price raised the marginal utility per dollar of clothing, and buying more lowers the marginal utility of clothing until the ratios are equal again."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Bill: 1 fish or 1 coconut per hour. Chris: 8 fish or 2 coconuts. Who does what?", "b": "Chris fishes and Bill gathers coconuts. A coconut costs Chris 4 fish but Bill only 1 fish."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "A fishhook doubles both Bill's and Chris's fishing. What changes?", "b": "Nothing. A coconut now costs Bill 2 fish and Chris 8 fish, so Chris still has the comparative advantage in fishing."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "What must a full-credit answer on the cost of attending Berkeley include?", "b": "Foregone earnings, the wages from a full-time job you give up (average earnings are about $60,000 a year), along with tuition and fees."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Is the optimal amount of pollution zero?", "b"

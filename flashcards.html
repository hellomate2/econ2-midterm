: "Usually not. The optimum is where social marginal cost equals social marginal benefit, which is typically a positive quantity."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Why is the area above supply and below price called producer surplus?", "b": "Supply is marginal cost. Producers receive the price on every unit but pay only each unit's marginal cost, so the gap summed over units is their surplus."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "What shape is the demand curve for eggs, and why?", "b": "Steep (inelastic) in the short run, because there is no single one-for-one substitute for eggs, so willingness to pay stays high."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Is a chicken farm in California a barrier to entry?", "b": "Yes in the short run, because land is expensive and makes a large fixed cost. Over five years it is a much smaller barrier, because in the long run no cost is fixed."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "How do you draw the baseline egg market?", "b": "Steep demand and a low, flat, upward-sloping supply crossing at 10 billion dozen and $2, with dotted lines to both axes."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Were the 2023 and 2025 egg price spikes a supply or demand shock?", "b": "Supply. Spikes peaked around January after the fall bird migration spread avian flu; no demand story explains January 2023 and January 2025 only."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "What happened in the egg graph in early 2025?", "b": "Supply shifted up and crossed the steep demand at about $6, while quantity fell only a little (to roughly 7.7 billion dozen), because demand is inelastic."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Why did Trader Joe's keep egg prices low while Denny's added surcharges?", "b": "Eggs are a small part of Trader Joe's costs but a large part of a breakfast diner's, so the shock raised Denny's marginal cost a lot. Both feared price gouging accusations, but only the grocer could absorb the cost."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Eras Tour: 10 million tickets and $2 billion in sales. Average price?", "b": "$2 billion \u00f7 10 million = $200."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "What demand and MR curves go with the given Eras Tour MC = 10Q?", "b": "Demand from $300 to 30 million (P = 300 \u2212 10Q) and MR from $300 to 15 million (MR = 300 \u2212 20Q), twice as steep."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Where is the Eras Tour monopoly outcome?", "b": "MR = MC at 10 million tickets (MC = $100), and the price read off demand is $200."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "With zero fixed costs, what was Taylor Swift's profit?", "b": "Revenue $2 billion minus total cost $500 million (the triangle under MC, \u00bd \u00d7 10 million \u00d7 $100) equals $1.5 billion. $1 billion was also accepted."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Should more Eras Tour tickets have been sold?", "b": "Yes. The efficient quantity is 15 million, where demand meets MC at $150; the monopoly sold 10 million, one third fewer."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Robinson (2 fish or 2 coconuts) joins Bill and Chris. Who gathers coconuts?", "b": "Bill and Robinson, because they share the lowest opportunity cost of a coconut (1 fish); Chris (4 fish) only fishes."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Describe PPC2 for Bill, Chris, and Robinson.", "b": "Intercepts 110 fish and 50 coconuts, one kink at (30 coconuts, 80 fish), slope \u22121 then \u22124, lying outside the straight PPC1."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "A rent ceiling is set below the market rent. Which curve shifts?", "b": "Neither. Rent is held at the ceiling, quantity rented falls to the supply curve's QS, and the shortage is QD \u2212 QS."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "Demand P = 5 \u2212 Q, flat supply MC = 1. Equilibrium, consumer surplus, producer surplus?", "b": "Equilibrium (4, 1), consumer surplus 8, producer surplus 0 because supply is flat at the price."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "In that oil market, what does a $2 per unit tax do?", "b": "Consumers pay all of it: price rises to 3, quantity falls to 2, consumer surplus 2, revenue 4, deadweight loss 2."}, {"u": "11-past-exam", "t": "Optional: last year's midterm", "f": "In that oil market, what does a monopoly do, and what if there is also $2 pollution?", "b": "MR = 5 \u2212 2Q = 1 gives Q = 2 and P = 3, with deadweight loss 2. With $2 pollution, SMC = 3 crosses demand at Q = 2, so the monopoly output is efficient by coincidence."}];</script>
<script>
(function(){var all=window.DECK,q=[],i=0,el=document.getElementById("card");
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

function show(){el.classList.remove("flip");var n=document.getElementById("count");if(!q.length){document.getElementById("cfront").innerHTML="Deck finished. Restart or pick another deck.";document.getElementById("cback").innerHTML="";document.getElementById("ctag").textContent="";n.textContent="0 cards left";return}var c=q[0];document.getElementById("cfront").innerHTML=esc(c.f);document.getElementById("cback").innerHTML=esc(c.b);document.getElementById("ctag").textContent=c.t;n.textContent=q.length+" cards left"}
function shuffle(){for(var k=q.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=q[k];q[k]=q[j];q[j]=t}show()}
el.addEventListener("click",function(){el.classList.toggle("flip")});
document.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.code==="Space"){e.preventDefault();el.classList.toggle("flip")}if(e.key==="ArrowRight")got();if(e.key==="ArrowLeft")again()});
function got(){q.shift();show()} function again(){if(q.length){q.push(q.shift());show()}}
document.getElementById("got").onclick=got;document.getElementById("again").onclick=again;document.getElementById("shuffle").onclick=shuffle;document.getElementById("restart").onclick=build;document.getElementById("unit-pick").onchange=build;build();shuffle()})();
</script><script src="site.js"></script></body></html>
